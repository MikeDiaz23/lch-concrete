<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="-.2"/>
        <feFuncG type="linear" slope="1.4" intercept="-.2"/>
        <feFuncB type="linear" slope="1.4" intercept="-.2"/>
      </feComponentTransfer>
    </filter>
    <filter id="mottling" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="512" height="512" filter="url(#grain)" opacity=".65"/>
  <rect width="512" height="512" filter="url(#mottling)" opacity=".35"/>
</svg>
